spring.application.name=high-throughput-payment-gateway
server.port=${SERVER_PORT:8080}

# Habilita Virtual Threads do Java 21 no Tomcat
spring.threads.virtual.enabled=true
server.tomcat.max-connections=8192
server.tomcat.accept-count=1000

# Desativa logs verbosos para maximizar o throughput
logging.level.root=WARN
logging.level.com.leonardonogueira=INFO

# Configurações do Gateway
gateway.redis.host=${GATEWAY_REDIS_HOST:${CAMPEAO_REDIS_HOST:localhost}}
gateway.redis.port=${GATEWAY_REDIS_PORT:${CAMPEAO_REDIS_PORT:6379}}
gateway.default-url=${GATEWAY_DEFAULT_URL:${CAMPEAO_GATEWAY_DEFAULT_URL:http://localhost:9999/mock/default}}
gateway.fallback-url=${GATEWAY_FALLBACK_URL:${CAMPEAO_GATEWAY_FALLBACK_URL:http://localhost:9999/mock/fallback}}
gateway.timeout-ms=${GATEWAY_TIMEOUT_MS:${CAMPEAO_GATEWAY_TIMEOUT_MS:2500}}
gateway.worker.concurrency=${GATEWAY_WORKER_CONCURRENCY:${CAMPEAO_WORKER_CONCURRENCY:32}}

# Mapeamento para beans de configuracao
campeao.redis.host=${gateway.redis.host}
campeao.redis.port=${gateway.redis.port}
campeao.gateway.default-url=${gateway.default-url}
campeao.gateway.fallback-url=${gateway.fallback-url}
campeao.gateway.timeout-ms=${gateway.timeout-ms}
campeao.worker.concurrency=${gateway.worker.concurrency}
