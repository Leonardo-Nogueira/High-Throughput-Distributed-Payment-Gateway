version: '3.8'

x-service-templates:
  payment-processor: &payment-processor
    image: zanfranceschi/payment-processor:amd64-20250807222453
    networks:
      - payment-network
      - payment-processor-db
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 10
        window: 5s
      resources:
        limits:
          cpus: "1.5"
          memory: "150MB"

  payment-processor-db: &payment-processor-db
    image: postgres:17-alpine
    command: postgres -c checkpoint_timeout=600 -c max_wal_size=4096 -c synchronous_commit=0 -c fsync=0 -c full_page_writes=0
    networks:
      - payment-processor-db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=payments
    deploy:
      restart_policy:
        condition: on-failure
        delay: 2s
        max_attempts: 10
        window: 5s
      resources:
        limits:
          cpus: "1.5"
          memory: "250MB"

services:
  # =========================================================================
  # 1. PROCESSADORES DE PAGAMENTO EXTERNOS (ADQUIRENTES MOCKADOS)
  # =========================================================================
  payment-processor-default:
    <<: *payment-processor
    container_name: payment-processor-default
    hostname: payment-processor-default
    environment:
      - TRANSACTION_FEE=0.07
      - RATE_LIMIT_SECONDS=5
      - INITIAL_TOKEN=123
      - DB_CONNECTION_STRING=Host=/var/run/postgresql;Port=5432;Database=payments;Username=postgres;Password=postgres;Minimum Pool Size=15;Maximum Pool Size=30;Connection Pruning Interval=3
    ports:
      - "8001:8080"
    volumes:
      - postgres-socket-01:/var/run/postgresql
    depends_on:
      - payment-processor-default-db

  payment-processor-default-db:
    <<: *payment-processor-db
    container_name: payment-processor-default-db
    hostname: payment-processor-default-db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-socket-01:/var/run/postgresql

  payment-processor-fallback:
    <<: *payment-processor
    container_name: payment-processor-fallback
    hostname: payment-processor-fallback
    environment:
      - TRANSACTION_FEE=0.10
      - RATE_LIMIT_SECONDS=5
      - INITIAL_TOKEN=123
      - DB_CONNECTION_STRING=Host=/var/run/postgresql;Port=5432;Database=payments;Username=postgres;Password=postgres;Minimum Pool Size=15;Maximum Pool Size=30;Connection Pruning Interval=3
    ports:
      - "8002:8080"
    volumes:
      - postgres-socket-02:/var/run/postgresql
    depends_on:
      - payment-processor-fallback-db

  payment-processor-fallback-db:
    <<: *payment-processor-db
    container_name: payment-processor-fallback-db
    hostname: payment-processor-fallback-db
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-socket-02:/var/run/postgresql

  # =========================================================================
  # 2. NOSSO GATEWAY DE ALTA PERFORMANCE (NGINX + SPRING BOOT + REDIS)
  # =========================================================================
  nginx:
    image: nginx:alpine
    container_name: payment-gateway-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "128MB"
    networks:
      - payment-network

  api1:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: payment-gateway-api-1
    environment:
      - SERVER_PORT=8080
      - GATEWAY_REDIS_HOST=redis
      - GATEWAY_REDIS_PORT=6379
      - GATEWAY_DEFAULT_URL=http://payment-processor-default:8080
      - GATEWAY_FALLBACK_URL=http://payment-processor-fallback:8080
      - GATEWAY_TIMEOUT_MS=2500
      - GATEWAY_WORKER_CONCURRENCY=128
    depends_on:
      - redis
      - payment-processor-default
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "384MB"
    networks:
      - payment-network

  api2:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: payment-gateway-api-2
    environment:
      - SERVER_PORT=8080
      - GATEWAY_REDIS_HOST=redis
      - GATEWAY_REDIS_PORT=6379
      - GATEWAY_DEFAULT_URL=http://payment-processor-default:8080
      - GATEWAY_FALLBACK_URL=http://payment-processor-fallback:8080
      - GATEWAY_TIMEOUT_MS=2500
      - GATEWAY_WORKER_CONCURRENCY=128
    depends_on:
      - redis
      - payment-processor-default
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "384MB"
    networks:
      - payment-network

  redis:
    image: redis:7-alpine
    container_name: payment-gateway-redis
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: "256MB"
    networks:
      - payment-network

  # Dashboard Oficial Visual do Redis (Redis Insight Web)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: payment-gateway-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - payment-network

networks:
  payment-network:
    name: payment-processor
    driver: bridge
  payment-processor-db:
    driver: bridge

volumes:
  postgres-socket-01:
  postgres-socket-02:

